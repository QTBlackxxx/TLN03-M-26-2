frr version 10.7.1
frr defaults traditional
hostname as200-borde1
log syslog informational
!
ip prefix-list PF-PRF-AS200-IN seq 5 permit 45.10.0.0/29
ip prefix-list PF-PRF-AS200-OUT seq 5 permit 50.20.0.0/29
!
route-map PRF-AS200-IN permit 10
 match ip address prefix-list PF-PRF-AS200-IN
exit
!
route-map PRF-AS200-OUT permit 10
 match ip address prefix-list PF-PRF-AS200-OUT
exit
!
interface eth1
 ip address 161.0.0.2/30
exit
!
interface eth2
 ip address 181.0.1.2/30
exit
!
interface eth3
 ip address 10.0.0.62/30
 ip router isis TLN03
 ipv6 router isis TLN03
 isis network point-to-point
exit
!
interface lo
 ip address 190.1.1.1/32
 ip router isis TLN03
 ipv6 address 2006:1:1::1/128
 ipv6 router isis TLN03
 isis passive
exit
!
router bgp 200
 bgp router-id 190.1.1.1
 no bgp default ipv4-unicast
 neighbor 161.0.0.1 remote-as 100
 neighbor 172.16.3.1 remote-as 200
 neighbor 172.16.3.1 update-source lo
 neighbor 172.16.3.2 remote-as 200
 neighbor 172.16.3.2 update-source lo
 neighbor fc10:16:3::1 remote-as 200
 neighbor fc10:16:3::1 update-source lo
 neighbor fc10:16:3::2 remote-as 200
 neighbor fc10:16:3::2 update-source lo
 !
 address-family ipv4 unicast
  neighbor 161.0.0.1 activate
  neighbor 161.0.0.1 route-map PRF-AS200-IN in
  neighbor 161.0.0.1 route-map PRF-AS200-OUT out
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fc10:16:3::1 activate
  neighbor fc10:16:3::2 activate
 exit-address-family
exit
!
router isis TLN03
 is-type level-2-only
 net 49.0001.0000.0000.0111.00
 advertise-passive-only
 topology ipv6-unicast
exit
!
