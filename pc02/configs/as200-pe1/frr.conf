frr version 10.7.1
frr defaults traditional
hostname as200-pe1
log syslog informational
!
vrf A
exit-vrf
!
interface eth1
 ip address 10.0.0.53/30
 ip router isis TLN03
 ipv6 router isis TLN03
 isis network point-to-point
exit
!
interface eth2
 ip address 10.0.0.50/30
 ip router isis TLN03
 ipv6 router isis TLN03
 isis network point-to-point
exit
!
interface eth3
 ip address 10.0.1.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface lo
 ip address 172.16.1.1/32
 ip router isis TLN03
 ipv6 address fc10:16:1::1/128
 ipv6 router isis TLN03
 isis passive
exit
!
router bgp 200
 bgp router-id 172.16.1.1
 no bgp default ipv4-unicast
 neighbor 172.16.3.1 remote-as 200
 neighbor 172.16.3.1 update-source lo
 neighbor 172.16.3.2 remote-as 200
 neighbor 172.16.3.2 update-source lo
 neighbor fc10:16:3::1 remote-as 200
 neighbor fc10:16:3::1 update-source lo
 neighbor fc10:16:3::2 remote-as 200
 neighbor fc10:16:3::2 update-source lo
 !
 address-family ipv4 unicast
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fc10:16:3::1 activate
  neighbor fc10:16:3::2 activate
 exit-address-family
exit
!
router bgp 200 vrf A
 bgp router-id 172.16.1.1
 !
 address-family ipv4 unicast
  redistribute ospf
  label vpn export auto
  rd vpn export 1:10
  rt vpn both 1:10
  export vpn
  import vpn
 exit-address-family
exit
!
router ospf vrf A
 ospf router-id 10.0.1.1
 redistribute bgp
exit
!
mpls ldp
 router-id 172.16.1.1
 !
 address-family ipv4
  discovery transport-address 172.16.1.1
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
!
router isis TLN03
 is-type level-2-only
 net 49.0001.0000.0000.0011.00
 advertise-passive-only
 topology ipv6-unicast
exit
!
