name: sp-core-rr-lab

topology:
  defaults:
    kind: linux
    image: frr:10.7.1-ssh
    sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.default.forwarding: 1
        net.mpls.platform_labels: 1048575
    exec:
      - bash -c 'for int in /proc/sys/net/mpls/conf/*/; do sysctl -w net.mpls.conf.$(basename $int).input=1; done'
    binds:
      - /lib/modules:/lib/modules:ro # Heredar módulos para plano de datos MPLS
    env:
      CLAB_INTFS_FLAGS: "all:mpls"    # Habilitar interfaces para tráfico MPLS

  nodes:
    # ==========================================
    # AS 100 (ISP OSPF & iBGP)
    # ==========================================
    # Route Reflectors
    as100-rr1:
      binds:
        - ./configs/as100-rr1:/etc/frr
    as100-rr2:
      binds:
        - ./configs/as100-rr2:/etc/frr
    # Core P Routers
    as100-p1:
      binds:
        - ./configs/as100-p1:/etc/frr
    as100-p2:
      binds:
        - ./configs/as100-p2:/etc/frr
    as100-p3:
      binds:
        - ./configs/as100-p3:/etc/frr
    as100-p4:
      binds:
        - ./configs/as100-p4:/etc/frr
    as100-p5:
      binds:
        - ./configs/as100-p5:/etc/frr
    # Provider Edge (PE)
    as100-pe1:
      binds:
        - ./configs/as100-pe1:/etc/frr
      exec:
      - bash -c "ip link add A type vrf table 10"
      - bash -c "ip link set A up"
      - bash -c "ip link set eth3 master A"

    as100-site1:
      binds:
        - ./configs/as100-site1:/etc/frr

    as100-site-1:
      binds:
        - ./configs/as100-site_1:/etc/frr

    as100-pe2:
      binds:
        - ./configs/as100-pe2:/etc/frr
      exec:
      - bash -c "ip link add A type vrf table 10"
      - bash -c "ip link set A up"
      - bash -c "ip link set eth3 master A"

    as100-site2:
      binds:
        - ./configs/as100-site2:/etc/frr

    as100-site-2:
      binds:
        - ./configs/as100-site_2:/etc/frr
  
    # ASBR / Borde Internacional
    as100-borde1:
      binds:
        - ./configs/as100-borde1:/etc/frr
    as100-borde2:
      binds:
        - ./configs/as100-borde2:/etc/frr
    # ==========================================
    # AS 200 (ISP IS-IS & iBGP)
    # ==========================================
    # Route Reflectors
    as200-rr1:
      binds:
        - ./configs/as200-rr1:/etc/frr
    as200-rr2:
      binds:
        - ./configs/as200-rr2:/etc/frr
    # Core P Routers
    as200-p1:
      binds:
        - ./configs/as200-p1:/etc/frr
    as200-p2:
      binds:
        - ./configs/as200-p2:/etc/frr
    as200-p3:
      binds:
        - ./configs/as200-p3:/etc/frr
    as200-p4:
      binds:
        - ./configs/as200-p4:/etc/frr 
    as200-p5:
      binds:
        - ./configs/as200-p5:/etc/frr
    # Provider Edge (PE)
    as200-pe1:
      binds:
        - ./configs/as200-pe1:/etc/frr
      exec:
      - bash -c "ip link add A type vrf table 10"
      - bash -c "ip link set A up"
      - bash -c "ip link set eth3 master A"

    as200-site1:
      binds:
        - ./configs/as200-site1:/etc/frr
    
    as200-site-1:
      binds:
        - ./configs/as200-site_1:/etc/frr

    as200-pe2:
      binds:
        - ./configs/as200-pe2:/etc/frr
      exec:
      - bash -c "ip link add A type vrf table 10"
      - bash -c "ip link set A up"
      - bash -c "ip link set eth3 master A"

    as200-site2:
      binds:
        - ./configs/as200-site2:/etc/frr
    
    as200-site-2:
      binds:
        - ./configs/as200-site_2:/etc/frr

    # ASBR / Borde Internacional
    as200-borde1:
      binds:
        - ./configs/as200-borde1:/etc/frr
    as200-borde2:
      binds:
        - ./configs/as200-borde2:/etc/frr

  links:
    # ------------------------------------------
    # INTERCONEXIÓN DE BORDE REDUNDANTE (eBGP)
    # ------------------------------------------
    # Malla cruzada entre los 4 routers de borde internacionales
    - endpoints: ["as100-borde1:eth1", "as200-borde1:eth1"]
    - endpoints: ["as100-borde1:eth2", "as200-borde2:eth1"]
    - endpoints: ["as100-borde2:eth1", "as200-borde1:eth2"]
    - endpoints: ["as100-borde2:eth2", "as200-borde2:eth2"]

    # ------------------------------------------
    # ENLACES INTERNOS AS 100 (OSPF)
    # ------------------------------------------
    # Core de 5 Routers P interconectados en anillo con enlaces cruzados
    - endpoints: ["as100-p1:eth1", "as100-p2:eth1"]
    - endpoints: ["as100-p2:eth2", "as100-p3:eth1"]
    - endpoints: ["as100-p3:eth2", "as100-p4:eth1"]
    - endpoints: ["as100-p4:eth2", "as100-p5:eth1"]
    - endpoints: ["as100-p5:eth2", "as100-p1:eth2"]
    - endpoints: ["as100-p2:eth3", "as100-p4:eth3"] # Enlace cruzado de transporte

    # Conexión redundante de los Route Reflectors al Core P
    - endpoints: ["as100-rr1:eth1", "as100-p1:eth3"]
    - endpoints: ["as100-rr1:eth2", "as100-p2:eth4"]
    - endpoints: ["as100-rr2:eth1", "as100-p2:eth5"]
    - endpoints: ["as100-rr2:eth2", "as100-p3:eth3"]

    # Conexión redundante de los PE al Core P
    - endpoints: ["as100-pe1:eth1", "as100-p4:eth4"]
    - endpoints: ["as100-pe1:eth2", "as100-p5:eth3"]
    - endpoints: ["as100-pe2:eth1", "as100-p5:eth4"]
    - endpoints: ["as100-pe2:eth2", "as100-p1:eth4"]

    # Conexión redundante de los Routers de BGP Borde al Core P
    - endpoints: ["as100-borde1:eth3", "as100-p3:eth4"]
    - endpoints: ["as100-borde2:eth3", "as100-p4:eth5"]

    # ------------------------------------------
    # ENLACES PE - CPE (AS-100)
    # ------------------------------------------
    # 
    - endpoints: ["as100-site1:eth1", "as100-pe1:eth3"]
    - endpoints: ["as100-site2:eth1", "as100-pe2:eth3"]
    - endpoints: ["as100-site-1:eth1", "as100-pe1:eth4"]
    - endpoints: ["as100-site-2:eth1", "as100-pe2:eth4"]

    # ------------------------------------------
    # ENLACES INTERNOS AS 200 (IS-IS)
    # ------------------------------------------
    # Core de 5 Routers P interconectados en anillo con enlaces cruzados
    - endpoints: ["as200-p1:eth1", "as200-p2:eth1"]
    - endpoints: ["as200-p2:eth2", "as200-p3:eth1"]
    - endpoints: ["as200-p3:eth2", "as200-p4:eth1"]
    - endpoints: ["as200-p4:eth2", "as200-p5:eth1"]
    - endpoints: ["as200-p5:eth2", "as200-p1:eth2"]
    - endpoints: ["as200-p2:eth3", "as200-p4:eth3"] # Enlace cruzado de transporte

    # Conexión redundante de los Route Reflectors al Core P
    - endpoints: ["as200-rr1:eth1", "as200-p1:eth3"]
    - endpoints: ["as200-rr1:eth2", "as200-p2:eth4"]
    - endpoints: ["as200-rr2:eth1", "as200-p2:eth5"]
    - endpoints: ["as200-rr2:eth2", "as200-p3:eth3"]

    # Conexión redundante de los PE al Core P
    - endpoints: ["as200-pe1:eth1", "as200-p4:eth4"]
    - endpoints: ["as200-pe1:eth2", "as200-p5:eth3"]
    - endpoints: ["as200-pe2:eth1", "as200-p5:eth4"]
    - endpoints: ["as200-pe2:eth2", "as200-p1:eth4"]

    # Conexión redundante de los Routers de BGP Borde al Core P
    - endpoints: ["as200-borde1:eth3", "as200-p3:eth4"]
    - endpoints: ["as200-borde2:eth3", "as200-p4:eth5"]

    # ------------------------------------------
    # ENLACES PE - CPE (AS-100)
    # ------------------------------------------
    # 
    - endpoints: ["as200-site1:eth1", "as200-pe1:eth3"]
    - endpoints: ["as200-site2:eth1", "as200-pe2:eth3"]
    - endpoints: ["as200-site-1:eth1", "as200-pe1:eth4"]
    - endpoints: ["as200-site-2:eth1", "as200-pe2:eth4"]